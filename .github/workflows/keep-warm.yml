name: Keep warm

# Free tier Supabase projects pause after about a week without database
# activity, and a paused project answers with a connection error. This runs a
# trivial read often enough that the clock never gets close.

on:
  schedule:
    # 07:00 UTC Monday and Thursday: never more than four days apart.
    - cron: '0 7 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # Both secrets live inside an environment of this name rather than at the
    # repository level, and a job only sees environment secrets when it says
    # which environment it runs in. Rename the environment and this line
    # together, or move the secrets to repository scope and drop this.
    environment: SUPABASE_URL
    steps:
      - name: Read one row through PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The public anon key, the same one shipped in the browser bundle.
          # It lives in a secret so rotating it is a single edit, not so that
          # it stays hidden.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "${SUPABASE_URL:-}" ]; then missing="SUPABASE_URL"; fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            missing="${missing:+$missing and }SUPABASE_ANON_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Empty secret(s): $missing. They belong in Settings ->"                 "Secrets and variables -> Actions -> *Secrets* tab -> Repository"                 "secrets. Values saved under the Variables tab, under Dependabot,"                 "or as Environment secrets are not visible to this job."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/issues?select=id&limit=1")
          echo "PostgREST returned ${code}"
          test "${code}" = "200"

      - name: Check the dashboard is still serving
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            https://supabase-triage-desk-hhsu.vercel.app/)
          echo "Dashboard returned ${code}"
          test "${code}" = "200"
