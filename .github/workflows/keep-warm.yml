name: Keep warm

# Free plan Supabase projects pause after a week of too little database
# activity, and a paused project loses its DNS record: the hostname stops
# resolving, so the dashboard shows "Failed to fetch" rather than an error
# anyone can read.
#
# Supabase's docs put the threshold at "a few user requests to the database each
# day over the previous week". This workflow first ran once a day with a single
# read, which was below that, and the project paused on 4 November 2026 and
# again around 10 November. It now runs every six hours and makes three
# different reads each time, about a dozen a day. That matches the documented
# threshold, but Supabase publishes no exact rule, so each run also works as an
# alarm: a pause becomes a failed run, and a GitHub email, within hours.

on:
  schedule:
    # Every six hours, at 17 minutes past to stay clear of the top-of-hour rush
    # that delays scheduled runs.
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # Both secrets live inside an environment of this name rather than at the
    # repository level, and a job only sees environment secrets when it says
    # which environment it runs in. Rename the environment and this line
    # together, or move the secrets to repository scope and drop this.
    #
    # deployment: false keeps the secrets but stops each run being recorded as
    # a GitHub deployment. Without it, every ping showed up on the repo page
    # as a deploy to "SUPABASE_URL", and every paused-project failure as a
    # failed deploy, although nothing is deployed here.
    environment:
      name: SUPABASE_URL
      deployment: false
    steps:
      - name: Read from the database through PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # The public anon key, the same one shipped in the browser bundle.
          # It lives in a secret so rotating it is a single edit, not so that
          # it stays hidden.
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "${SUPABASE_URL:-}" ]; then missing="SUPABASE_URL"; fi
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            missing="${missing:+$missing and }SUPABASE_ANON_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Empty secret(s): ${missing}. Add them to the SUPABASE_URL environment under Settings > Environments, or at repository scope and remove this job's environment line."
            exit 1
          fi
          # Three different queries, each a real read against the database: a
          # table, the queue view with its joins, and the label list.
          for path in \
            "issues?select=id&limit=1" \
            "issue_queue?select=id&state=eq.open&limit=1" \
            "labels?select=name&limit=1"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              "${SUPABASE_URL}/rest/v1/${path}")
            echo "${path} -> ${code}"
            test "${code}" = "200"
          done

      - name: Check the dashboard is still serving
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            https://supabase-triage-desk-hhsu.vercel.app/)
          echo "Dashboard returned ${code}"
          test "${code}" = "200"
